[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supergrid-llm"
version = "1.0.0"
description = "Minimal example: run an LLM across 2 Flower SuperGrid (SuperLink + SuperNode) nodes"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "flwr>=1.40.0,<2.0.0",
    "ollama>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["supergrid_llm"]

[tool.flwr.app]
publisher = "juanmarceloparra"

[tool.flwr.app.components]
serverapp = "supergrid_llm.server_app:app"
clientapp = "supergrid_llm.client_app:app"

[tool.flwr.app.config]
model = "llama3.2:latest"
prompt = "In one sentence, what is federated learning?"
