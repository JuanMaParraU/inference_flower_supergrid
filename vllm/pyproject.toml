[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supergrid-vllm"
version = "1.0.0"
description = "Minimal example: run an LLM served by vLLM across Flower SuperGrid (SuperLink + SuperNode) nodes"
license = "Apache-2.0"
dependencies = [
    "flwr>=1.13.0,<1.24.0",
    "openai>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["supergrid_vllm"]

[tool.flwr.app]
publisher = "juanmarceloparra"

[tool.flwr.app.components]
serverapp = "supergrid_vllm.server_app:app"
clientapp = "supergrid_vllm.client_app:app"

[tool.flwr.app.config]
model = "Qwen/Qwen2.5-0.5B-Instruct"
vllm-url = "http://127.0.0.1:8000/v1"
max-tokens = 128
prompt = "In one sentence, what is federated learning?"

[tool.flwr.federations]
default = "supergrid"

[tool.flwr.federations.supergrid]
address = "127.0.0.1:9093"
insecure = true
